    OWN-WORLD: gloss-black ground, panel black; LED green is the only action colour; LED purple the ambient band; route-board yellow for wayfinding; chrome hairlines. Bungee for signage lettering, Barlow Condensed caps for labels, system sans body. Vinyl-cut caption plates, luminous LED rules, red/white reflective chevron as the NEW mark. No gradient text, no glass.
    STORY: a visitor from WhatsApp boards, sees the roster and the newest drop playing, taps play, taps an artist, joins.
    FIRST VIEWPORT: route board across the top (sacco name left, destinations right); three artist panels edge to edge beneath (horizontal snap on phones); the NOW PLAYING LED strip pinned along the bottom carrying the newest release and the primary Play.
