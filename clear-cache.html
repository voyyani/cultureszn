<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache</title>
</head>
<body>
    <h1>Cache Management</h1>
    
    <button onclick="clearCache()">Clear All Release Caches</button>
    <button onclick="showCache()">Show Current Cache</button>
    
    <div id="output"></div>
    
    <script>
        function clearCache() {
            const keys = Object.keys(localStorage);
            const releaseKeys = keys.filter(k => k.startsWith('latest-releases'));
            
            releaseKeys.forEach(key => localStorage.removeItem(key));
            
            document.getElementById('output').innerHTML = `
                <h2 style="color: green;">✅ Cleared ${releaseKeys.length} cache entries</h2>
                <p>Reload the app to fetch fresh data</p>
            `;
        }
        
        function showCache() {
            const keys = Object.keys(localStorage);
            const releaseKeys = keys.filter(k => k.startsWith('latest-releases'));
            
            let html = '<h2>Current Caches:</h2>';
            
            releaseKeys.forEach(key => {
                try {
                    const data = JSON.parse(localStorage.getItem(key));
                    html += `
                        <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                            <h3>${key}</h3>
                            <p>Source: ${data.source}</p>
                            <p>Timestamp: ${data.timestamp}</p>
                            <p>Count: ${data.data ? data.data.length : 0} releases</p>
                            ${data.data && data.data.length > 0 ? `
                                <details>
                                    <summary>First Release</summary>
                                    <pre>${JSON.stringify(data.data[0], null, 2)}</pre>
                                </details>
                            ` : '<p style="color: red;">⚠️ No releases in cache!</p>'}
                        </div>
                    `;
                } catch (e) {
                    html += `<div style="border: 1px solid red; padding: 10px; margin: 10px 0;">
                        <h3>${key}</h3>
                        <p style="color: red;">Error: ${e.message}</p>
                    </div>`;
                }
            });
            
            if (releaseKeys.length === 0) {
                html += '<p>No release caches found</p>';
            }
            
            document.getElementById('output').innerHTML = html;
        }
        
        // Auto-show on load
        showCache();
    </script>
</body>
</html>
